# Release: 버전 태그(vX.Y.Z)를 올리면 Windows·Linux·macOS 설치본을 각 OS에서 자동 빌드해
# GitHub 릴리스에 업로드한다(자동업데이트용 latest.yml 포함).
#
# 릴리스 절차:
#   1) electron/package.json 의 version 을 올린다(예: 0.2.0). ← 릴리스 이름/자동업데이트 기준.
#   2) 커밋 후 그 버전과 같은 태그를 올린다:  git tag v0.2.0 && git push origin v0.2.0
#   3) 이 워크플로가 3-OS 설치본을 만들어 v0.2.0 릴리스에 붙인다.
#
# 아직 남은 전제(코드 밖):
#   - 코드 서명 인증서 없음 → 설치본은 미서명(SmartScreen/Gatekeeper 경고). 인증서 생기면
#     electron-builder 서명 설정 + 시크릿(CSC_LINK/CSC_KEY_PASSWORD 등)만 추가하면 된다.
#   - 아이콘은 1024px 로 준비됨(icon.png) → mac dmg 빌드 가능. 다만 서명·공증은 아직이라
#     mac 잡은 첫 릴리스 안전망으로 continue-on-error 를 유지(그린 확인되면 제거).
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch: {} # 수동 실행: 퍼블리시 없이 빌드만 검증

permissions:
  contents: write # GitHub 릴리스에 설치본 업로드 권한

jobs:
  build:
    name: 빌드·퍼블리시 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # 아이콘은 해결됨. 서명·공증 미적용이라 첫 릴리스 안전망으로만 mac 을 비차단 유지.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # onnx 는 make_int8(int8 양자화)에만 필요. fastembed/onnxruntime 등은 .[all] 로 들어온다.
      - name: Python 빌드 의존성
        run: pip install ".[all]" pyinstaller onnx

      - name: 프론트 빌드
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

      # PyInstaller onedir(vestige-backend) + int8 e5-large 모델 생성·동봉 → dist/vestige-backend/
      - name: 백엔드 빌드(사이드카)
        shell: bash
        env:
          PYTHONUTF8: "1" # Windows 콘솔 인코딩(cp1252)으로 인한 비ASCII 로그 UnicodeEncodeError 방지
          HF_HUB_DISABLE_SYMLINKS: "1" # HF 캐시 외부데이터 심링크로 인한 onnx 양자화 실패 방지(소스에서도 복사로 처리)
        run: bash packaging/build-backend.sh

      # 동결된 파이썬 사이드카가 그 OS에서 실제로 부팅해 서빙하는지(런타임 검증).
      # 빌드만이 아니라 네이티브 의존성(onnxruntime·sqlite-vec·fastembed·uvicorn) 로드+서버 기동을 확인.
      # GUI(Electron 창)는 헤드리스 CI에서 못 띄우므로 백엔드까지만 — 그래도 런타임 부팅 실패는 여기서 잡힘.
      - name: 백엔드 스모크(동결 사이드카 부팅 + API 응답)
        shell: bash
        env:
          VESTIGE_MANAGED: "1"          # 순수 서버 모드(브라우저·단일인스턴스 로직 끔 — Electron 셸과 동일)
          VESTIGE_DATA_DIR: ${{ runner.temp }}/smoke-data
          CLAUDE_PROJECTS_DIR: ${{ runner.temp }}/smoke-proj
          VESTIGE_SOURCES: "claude-code"
          VESTIGE_INDEX_MODE: "off"
        run: |
          set -e
          mkdir -p "$VESTIGE_DATA_DIR" "$CLAUDE_PROJECTS_DIR"
          BIN="dist/vestige-backend/vestige-backend"
          if [ -f "$BIN.exe" ]; then BIN="$BIN.exe"; fi
          PORT=8799
          "$BIN" "$PORT" &
          PID=$!
          ok=0
          for i in $(seq 1 40); do
            sleep 3
            if curl -fsS "http://127.0.0.1:$PORT/api/stats" -o stats.json 2>/dev/null; then ok=1; break; fi
          done
          # 설정·시스템메모리 경로(그 OS에서 도는지)도 함께 확인 — 실패해도 비차단(참고용).
          curl -fsS "http://127.0.0.1:$PORT/api/embed-models" -o models.json 2>/dev/null || true
          kill "$PID" 2>/dev/null || true
          if [ "$ok" != "1" ]; then
            echo "::error::동결 백엔드가 /api/stats 에 응답하지 않음(런타임 부팅 실패)"
            exit 1
          fi
          echo "smoke OK — /api/stats:"; cat stats.json; echo
          echo "embed-models(head):"; head -c 400 models.json 2>/dev/null || true

      - name: electron 의존성
        run: npm --prefix electron ci

      # 태그 푸시면 GitHub 릴리스에 퍼블리시, 수동 실행이면 빌드만(never).
      - name: 설치본 빌드·퍼블리시
        working-directory: electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # 서명 인증서 없음 → 자동 서명 탐색 끔(mac)
        run: npx electron-builder --publish ${{ github.event_name == 'push' && 'always' || 'never' }}

      # 수동 실행(테스트 빌드)일 때만: 만들어진 설치본을 다운로드 가능한 아티팩트로 올린다.
      # (태그 릴리스는 이미 릴리스 자산으로 붙으므로 불필요. unpacked 폴더는 용량 커서 제외.)
      - name: 테스트 설치본 업로드(수동 실행 전용)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: vestige-installer-${{ matrix.os }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            electron/dist/*.dmg
            electron/dist/*.exe
            electron/dist/*.zip
            electron/dist/*.AppImage
